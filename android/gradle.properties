org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 构建缓存目录见 GRADLE_USER_HOME=D:\dev-cache\gradle（scripts/dev-env.ps1 / 用户环境变量）
# 慢/不稳定国际网络(VPN)下载依赖时放宽超时，避免中途失败
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
# AGP 9.0 移除了 proguard-android.txt；部分旧插件(如 flutter_inappwebview_android 1.1.3)仍引用它。
# 官方逃生开关：允许旧插件继续使用 proguard-android.txt（AGP 10 将移除该开关，届时需升级相关插件）。
android.r8.proguardAndroidTxt.disallowed=false
# 关闭 Kotlin 增量编译：项目在 E: 盘、pub 缓存在 C: 盘时，增量编译器计算跨盘相对路径会抛
# IllegalArgumentException(different roots)，导致 audio_session/flutter_contacts 等插件编译失败。
kotlin.incremental=false
# 部分插件 Java=11 / Kotlin=17，严格校验会直接失败；降为 warning 以便 release 打包
kotlin.jvm.target.validation.mode=warning
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
