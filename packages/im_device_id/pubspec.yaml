name: im_device_id
description: Android hardware id / appgen MethodChannel as a standard Flutter plugin.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.cyberis.vortek.deviceid
        pluginClass: ImDeviceIdPlugin
